# Coolify build. Keep the Node major here in step with .nvmrc — Nixpacks tops
# out at Node 23, so .nvmrc must not be raised past that or local and deployed
# builds silently diverge. The explicit pin is deliberate: Nixpacks would
# otherwise read the `engines.node` range from package.json and greedily pick
# the newest Node it has, which is not a pin at all.
[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm run build"]

# `next build` static-exports to out/; there is no Node server to run, so the
# start script serves those files. Coolify injects PORT.
[start]
cmd = "pnpm start"
