# Weekly check: have any of the explainer's pinned upstream repos moved? If so, open (or update)
# an issue listing the new commits so a maintainer can run the clpr-sync skill. Never edits content.
name: Upstream watch

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Compare pinned commits with upstream HEAD
        id: cmp
        run: |
          pnpm --filter clpr-explainer exec kse sync-upstream --report-only > report.md
          if grep -q '^- \*\*' report.md; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          cat report.md
      - name: Open or update the tracking issue
        if: steps.cmp.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = 'Upstream CLPR repos have moved: run the clpr-sync skill';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-sync' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['upstream-sync'] });
            }
